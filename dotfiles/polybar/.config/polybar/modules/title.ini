[module/title]
type = custom/script

exec = python3 ~/.config/polybar/scripts/title.py
tail = true

format = <label>
format-prefix = "%{T1} %{T-}"
format-prefix-background = ${colors.purple}
format-prefix-foreground = ${colors.bg}
format-prefix-padding = 1
label = %{T1}%output%%{T-}
label-background = ${colors.bg-alt}
label-foreground = ${colors.fg}
label-maxlen = 40
label-padding = 1