[module/audio-output]
type = custom/script
exec = ~/.config/polybar/scripts/audio-output.sh
interval = 2

format = <label>
format-suffix =  "  "  
format-suffix-background = ${colors.purple}
format-suffix-foreground = ${colors.bg}
label-background = ${colors.bg-alt}
label-foreground = ${colors.fg}

label = " %output% "

click-right = ~/.config/polybar/scripts/audio-output.sh next
click-left = ~/.config/polybar/scripts/audio-output.sh menu