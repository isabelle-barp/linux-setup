[module/date]
type = internal/date
interval = 5

time = "%H:%M"
time-alt = "%a, %b %d %H:%M"

format = <label>
format-suffix = "%{T1}  %{T-}"
format-suffix-background = ${colors.green}
format-suffix-foreground = ${colors.bg}
format-suffix-padding = 1
label = %{T0}%time%%{T-}
label-background = ${colors.bg-alt}
label-foreground = ${colors.fg}
label-padding = 1