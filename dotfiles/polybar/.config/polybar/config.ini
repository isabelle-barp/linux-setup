[colors]
bg = #2E3440
bg-alt = #3B4252
bg-wp = #000000
fg = #ECEFF4
fg-alt = #E5E9F0

blue = #81A1C1
dark-blue = #5E81AC
cyan = #88C0D0
green = #A3BE8C
orange = #D08770
purple = #B48EAD
red = #BF616A
yellow = #EBCB8B
teal = #8FBCBB

black = #000
white = #FFF

trans = #00000000
semi-trans-black = #aa000000

include-file = ~/.config/polybar/modules/trap-left.ini
include-file = ~/.config/polybar/modules/trap-right.ini
include-file = ~/.config/polybar/modules/round-left.ini
include-file = ~/.config/polybar/modules/round-right.ini

include-file = ~/.config/polybar/modules/workspaces.ini
include-file = ~/.config/polybar/modules/date.ini
include-file = ~/.config/polybar/modules/margin.ini
include-file = ~/.config/polybar/modules/sysmenu.ini
include-file = ~/.config/polybar/modules/launcher.ini
include-file = ~/.config/polybar/modules/title.ini
include-file = ~/.config/polybar/modules/updates.ini
include-file = ~/.config/polybar/modules/audio-input.ini
include-file = ~/.config/polybar/modules/audio-output.ini

include-file = ~/.config/polybar/modules/links.ini


[bar/main]
bottom = true
width = 100%
height = 50
background = ${colors.bg-wp}
foreground = ${colors.fg}

padding = 1
padding-top = 2
padding-bottom = 1

font-0 = "JetBrainsMono Nerd Font:style=Thin:pixelsize=20;3"
font-1 = "JetBrainsMono Nerd Font:style=Bold:pixelsize=36;5"
font-2 = "FiraCode Nerd Font Mono:style=Light:pixelsize=30;1"

modules-left = launcher margin title round-right
modules-center = trap-left workspaces trap-right
modules-right = round-left audio-output margin audio-input margin date margin updates margin sysmenu
