shadow = true;
shadow-radius = 3;
shadow-offset-x = -0.5;
shadow-offset-y = -0.5;
shadow-opacity = 0.3;
shadow-color = "#000000";

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;

frame-opacity = 1.0;

inactive-dim = 0.15;
inactive-opacity = 0.95;
opacity-rule = [
	"95:class_g = 'Rofi'",
	"95:class_g = 'Conky'",
	"100:class_g = 'popup'",
  	"100:class_g = 'dropdown'",
  	"100:class_g = 'menu'",
	"100:class_g = 'Dunst'"
]

backend = "glx"
blur-background = true;
blur-background-frame = true;
blur-kern = "3x3box";
blur-method = "dual_kawase";
blur-strength = 7;
blur-background-exclude = [
	"focused",
	"class_g = 'Conky'",
	"class_g = 'Rofi'"
]

unredir-if-possible=true;
dithered-present = false;
vsync = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;


focus-exclude = [
	"class_g = 'Conky'",
	"class_g = 'Rofi'",
	"class_g = 'Dunst'"
]