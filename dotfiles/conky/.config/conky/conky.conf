-- Example Conky configuration
-- Symlinked to ~/.config/conky/conky.conf via:
--   bash scripts/80_dotfiles.sh conky

conky.config = {
  alignment = 'top_right',
  background = false,
  double_buffer = true,
  update_interval = 1,
  own_window = true,
  own_window_type = 'dock',
  own_window_class = 'Conky',
  own_window_argb_visual = true,
  own_window_argb_value = 0,
  gap_x = 30,
  gap_y = 60,
  minimum_width = 250,
  use_xft = true,
  font = 'JetBrainsMono Nerd Font:size=10',
  default_color = 'white',
  color1 = 'cyan',
};

conky.text = [[
${alignc}${color1}${time %a, %d %b %Y}${color}
${alignc}${time %H:%M:%S}

Uptime: ${uptime}
CPU: ${cpu}%  ${cpubar 8}
RAM: ${mem} / ${memmax}  ${membar 8}
Disk: ${fs_used /} / ${fs_size /}  ${fs_bar 8 /}
Net: ${downspeedf eth0} ↓  ${upspeedf eth0} ↑
]]
